<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉他英雄训练站 | Guitar Hero Training Station</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-brand">吉他英雄训练站</div>
        <div class="app-actions">
            <a id="stem-btn" class="btn-stem" href="stems.html">分轨纯享</a>
            <button id="my-history-btn" class="btn-history">我的历史</button>
            <div class="user-bar" id="user-bar">
                <span id="user-name" class="user-name"></span>
                <button id="auth-btn" class="btn-auth">登录 / 注册</button>
                <button id="logout-btn" class="btn-auth btn-logout" style="display:none">退出</button>
            </div>
        </div>
    </header>

    <div class="app">
        <!-- 左侧：对话区 -->
        <aside class="panel panel-chat">
            <div class="panel-header">
                <span class="panel-title">对话区</span>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-wrap">
                <input id="chat-input" type="text" placeholder="说你想弹什么曲子..." autocomplete="off" />
                <button id="chat-send">发送</button>
                <input id="audio-upload" type="file" accept="audio/*" style="display:none" />
                <button id="audio-btn">上传音频</button>
                <button id="surprise-btn" class="btn-surprise">给我来点没听过的</button>
                <button id="tone-btn" class="btn-tone">推荐音色</button>
            </div>
        </aside>

        <!-- 可拖拽分隔条 -->
        <div id="resizer" class="resizer"></div>

        <!-- 中间：谱面区（视觉重心） -->
        <main class="panel panel-score">
            <div class="panel-header">
                <span class="panel-title">谱面区</span>
                <div class="score-controls">
                    <button id="play-btn" class="btn-play">播放</button>
                    <button id="stop-btn" class="btn-stop">停止</button>
                    <button id="download-gp5-btn" class="btn-download" disabled>下载 GP5</button>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-bar-container">
                <span id="current-time" class="time-label">0:00</span>
                <div id="progress-bar" class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                    <div id="progress-handle" class="progress-handle"></div>
                </div>
                <span id="total-time" class="time-label">0:00</span>
            </div>

            <!-- 控制面板 -->
            <div class="control-panel">
                <div class="control-group">
                    <label class="control-label">原曲 MP3</label>
                    <button id="toggle-original" class="toggle-btn">静音</button>
                    <input type="range" id="volume-original" class="volume-slider" min="0" max="100" value="80" />
                </div>
                <div class="control-group">
                    <label class="control-label">解析音轨</label>
                    <button id="toggle-parsed" class="toggle-btn">静音</button>
                    <input type="range" id="volume-parsed" class="volume-slider" min="0" max="100" value="80" />
                </div>
                <div class="control-group">
                    <label class="control-label">谱面播放</label>
                    <button id="toggle-score" class="toggle-btn active">开</button>
                    <input type="range" id="volume-score" class="volume-slider" min="0" max="100" value="80" />
                </div>
            </div>

            <div id="score-container" class="score-container">
                <div class="placeholder-text">发送消息后，谱面将在此渲染</div>
            </div>
            <div id="alphaTab-api" style="display:none;"></div>
            <div class="history-section">
                <div class="history-header">
                    <span class="panel-title">最近生成</span>
                </div>
                <div id="history-list" class="history-list"></div>
            </div>
        </main>

        <!-- 可拖拽分隔条 -->
        <div id="resizer-memory" class="resizer"></div>

        <!-- 右侧：记忆面板 -->
        <aside class="panel panel-memory">
            <div class="panel-header">
                <span class="panel-title">记忆面板</span>
            </div>
            <div class="memory-body">
                <div class="memory-section" id="memory-profile-section">
                    <div class="memory-section-title">画像</div>
                    <div id="memory-profile" class="memory-profile">暂无画像数据</div>
                </div>
                <div class="memory-section" id="memory-rules-section">
                    <div class="memory-section-title">规则 <span id="memory-rules-count" class="memory-count"></span></div>
                    <div id="memory-rules" class="memory-rules">暂无规则</div>
                </div>
                <div class="memory-section" id="memory-episodes-section">
                    <div class="memory-section-title">情景</div>
                    <div id="memory-episodes" class="memory-episodes">情景数：0</div>
                </div>
                <div class="memory-section" id="memory-cost-section">
                    <div class="memory-section-title">成本统计</div>
                    <div id="memory-cost" class="memory-cost"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 登录/注册弹窗 -->
    <div id="auth-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" id="auth-modal-close">&times;</button>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
                <button class="auth-tab" data-tab="forgot">忘记密码</button>
            </div>

            <form id="login-form" class="auth-form active">
                <h3>欢迎回来</h3>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" required minlength="3" maxlength="32" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" required minlength="8" />
                </div>
                <div class="form-group form-inline">
                    <input type="checkbox" id="login-remember" />
                    <label for="login-remember">记住登录状态</label>
                </div>
                <div class="form-error" id="login-error"></div>
                <button type="submit" class="btn-submit">登录</button>
            </form>

            <form id="register-form" class="auth-form">
                <h3>创建账号</h3>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" required minlength="3" maxlength="32" />
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" required />
                </div>
                <div class="form-group">
                    <label>密码（至少8位）</label>
                    <input type="password" id="register-password" required minlength="8" />
                </div>
                <div class="form-error" id="register-error"></div>
                <button type="submit" class="btn-submit">注册</button>
            </form>

            <form id="forgot-form" class="auth-form">
                <h3>重置密码</h3>
                <p class="form-hint">输入注册邮箱，我们将发送重置链接。</p>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="forgot-email" required />
                </div>
                <div class="form-error" id="forgot-error"></div>
                <div class="form-success" id="forgot-success"></div>
                <button type="submit" class="btn-submit">发送重置链接</button>
            </form>

            <form id="reset-form" class="auth-form">
                <h3>设置新密码</h3>
                <div class="form-group">
                    <label>新密码（至少8位）</label>
                    <input type="password" id="reset-password" required minlength="8" />
                </div>
                <div class="form-error" id="reset-error"></div>
                <div class="form-success" id="reset-success"></div>
                <button type="submit" class="btn-submit">重置密码</button>
            </form>
        </div>
    </div>

    <!-- 音频上传方式选择弹窗 -->
    <div id="audio-mode-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" id="audio-mode-modal-close">&times;</button>
            <h3>选择上传方式</h3>
            <p class="form-hint">请选择你要上传的音频类型，Agent 会按对应方式处理。</p>
            <div class="audio-mode-grid">
                <label class="audio-mode-card">
                    <input type="radio" name="audio-mode" value="song" checked />
                    <div class="audio-mode-icon">🎵</div>
                    <div class="audio-mode-info">
                        <div class="audio-mode-title">完整歌曲</div>
                        <div class="audio-mode-desc">自动分离出吉他音轨，再转谱</div>
                    </div>
                </label>
                <label class="audio-mode-card">
                    <input type="radio" name="audio-mode" value="guitar" />
                    <div class="audio-mode-icon">🎸</div>
                    <div class="audio-mode-info">
                        <div class="audio-mode-title">吉他音轨</div>
                        <div class="audio-mode-desc">已经是单独的吉他录音，直接转谱</div>
                    </div>
                </label>
            </div>
            <button type="button" id="audio-mode-confirm" class="btn-submit">确定并选择文件</button>
        </div>
    </div>

    <!-- 我的历史弹窗 -->
    <div id="history-modal" class="modal" style="display:none;">
        <div class="modal-content modal-content-lg">
            <button class="modal-close" id="history-modal-close">&times;</button>
            <h3>我的音频提取历史</h3>
            <div id="history-login-tip" class="form-hint" style="display:none;">登录后可查看个人历史记录。</div>
            <div id="my-history-list" class="history-list"></div>
            <div class="history-pagination" id="history-pagination" style="display:none;">
                <button id="history-prev" class="btn-outline">上一页</button>
                <span id="history-page-info"></span>
                <button id="history-next" class="btn-outline">下一页</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
